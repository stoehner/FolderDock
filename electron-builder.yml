appId: dev.folderdock.app
productName: FolderDock
copyright: Copyright © 2026 Stones

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: resources
    to: resources

asar: true

publish:
  provider: github
  owner: stoehner
  repo: FolderDock
  releaseType: draft

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: FolderDock
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}
