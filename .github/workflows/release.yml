name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse a tag that does not match package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            Write-Host "Tag '$($env:GITHUB_REF_NAME)' does not match package.json version 'v$version'."
            exit 1
          }

      - name: Generate icons
        run: npm run icons

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npx playwright test
        env:
          FOLDERDOCK_SOFTWARE_GPU: '1'

      - name: Build installers and draft the GitHub Release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Consolidate duplicate draft releases
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $all = Invoke-RestMethod -Uri 'https://api.github.com/repos/stoehner/FolderDock/releases?per_page=100' -Headers $hdr
          $drafts = @($all | Where-Object { $_.draft -and $_.tag_name -eq $tag })
          if ($drafts.Count -le 1) { "No duplicate drafts for $tag."; exit 0 }
          $keeper = $drafts | Sort-Object { -($_.assets | Measure-Object).Count } | Select-Object -First 1
          foreach ($extra in @($drafts | Where-Object { $_.id -ne $keeper.id })) {
            foreach ($asset in @($extra.assets)) {
              $tmp = Join-Path $env:RUNNER_TEMP $asset.name
              Invoke-RestMethod -Uri $asset.url -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } -OutFile $tmp
              if ((Get-Item $tmp).Length -ne $asset.size) { throw "Downloaded $($asset.name) is $((Get-Item $tmp).Length) bytes, expected $($asset.size)." }
              $upload = "https://uploads.github.com/repos/stoehner/FolderDock/releases/$($keeper.id)/assets?name=$([uri]::EscapeDataString($asset.name))"
              Invoke-RestMethod -Method Post -Uri $upload -Headers $hdr -ContentType 'application/octet-stream' -InFile $tmp
              Remove-Item $tmp -ErrorAction SilentlyContinue
            }
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/stoehner/FolderDock/releases/$($extra.id)" -Headers $hdr
          }
          "Merged duplicate drafts for $tag into release id $($keeper.id)."

      - name: Verify assets and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $setupName = "FolderDock-Setup-$version.exe"
          $portableName = "FolderDock-$version-portable.exe"
          # GitHub's get-release-by-tag endpoint returns 404 for unfinished DRAFT releases; resolve via the list.
          $all = Invoke-RestMethod -Uri 'https://api.github.com/repos/stoehner/FolderDock/releases?per_page=100' -Headers $hdr
          $candidates = @($all | Where-Object { $_.tag_name -eq $tag })
          if ($candidates.Count -eq 0) { throw "No release object found for $tag." }
          if ($candidates.Count -gt 1) { throw "$($candidates.Count) release objects found for $tag; consolidation did not merge them." }
          $rel = $candidates[0]
          if (-not $rel.draft) { throw "Release $tag already exists as published (published_at=$($rel.published_at)); refusing to double-publish." }
          $assets = @($rel.assets | ForEach-Object { $_.name })
          $expected = @($setupName, "$setupName.blockmap", $portableName, 'latest.yml')
          if ($assets.Count -ne $expected.Count) { throw "Release $tag has $($assets.Count) assets, expected 4. Found: $($assets -join ', ')." }
          foreach ($name in $expected) {
            if (-not ($assets -contains $name)) { throw "Release $tag is missing asset '$name'. Found: $($assets -join ', ')." }
          }
          $tmp = Join-Path $env:RUNNER_TEMP 'latest.yml'
          $ymlAsset = $rel.assets | Where-Object { $_.name -eq 'latest.yml' }
          Invoke-RestMethod -Uri $ymlAsset.url -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } -OutFile $tmp
          $yml = Get-Content $tmp -Raw
          if (-not $yml.Contains("version: $version")) { throw "latest.yml does not carry version $version." }
          if (-not $yml.Contains($setupName)) { throw "latest.yml does not reference $setupName." }
          Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/stoehner/FolderDock/releases/$($rel.id)" -Headers $hdr -ContentType 'application/json' -Body '{"draft": false}' | Out-Null
          $latest = Invoke-RestMethod -Uri 'https://api.github.com/repos/stoehner/FolderDock/releases/latest' -Headers $hdr
          if ($latest.tag_name -ne $tag) { throw "releases/latest reports $($latest.tag_name), expected $tag." }
          "Published $tag (release id $($rel.id)); releases/latest now reports $tag."
